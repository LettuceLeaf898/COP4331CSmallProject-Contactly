swagger: '2.0'
info:
  description: This is the API documentation for the COP 4331 Contacts App
  version: 1.0.0
  title: Contactly
  contact:
    email: br418416@ucf.edu,
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

host: contactly101.xyz
basePath: /LAMPAPI
schemes:
  - http

definitions:
  Register:
    type: object
    required:
      - firstName
      - lastName
      - login
      - password
    properties:
      firstName:
        type: string
        example: "Jane"
      lastName:
        type: string
        example: "Doe"
      login:
        type: string
        example: "janedoe"
      password:
        type: string
        example: "mypassword"
      email:
        type: string
        example: "jane@example.com"
      phoneNumber:
        type: string
        example: "555-1234"

  Login:
    type: object
    required:
      - login
      - password
    properties:
      login:
        type: string
        example: "janedoe"
      password:
        type: string
        example: "mypassword"

  AddContact:
    type: object
    required:
      - firstName
      - lastName
      - phone
      - email
      - userId
    properties:
      firstName:
        type: string
        example: "John"
      lastName:
        type: string
        example: "Smith"
      phone:
        type: string
        example: "555-9999"
      email:
        type: string
        example: "john@example.com"
      userId:
        type: integer
        example: 1

  UpdateContact:
    type: object
    required:
      - contactId
      - userId
      - firstName
      - lastName
      - phone
      - email
    properties:
      contactId:
        type: integer
        example: 1
      userId:
        type: integer
        example: 1
      firstName:
        type: string
        example: "John"
      lastName:
        type: string
        example: "Smith"
      phone:
        type: string
        example: "555-0000"
      email:
        type: string
        example: "john@example.com"

  DeleteContact:
    type: object
    required:
      - contactId
      - userId
    properties:
      contactId:
        type: integer
        example: 1
      userId:
        type: integer
        example: 1

  DeleteUser:
    type: object
    required:
      - userId
    properties:
      userId:
        type: integer
        example: 1

  SearchContacts:
    type: object
    required:
      - userId
      - search
    properties:
      userId:
        type: integer
        example: 1
      search:
        type: string
        example: "john"

  SortContacts:
    type: object
    required:
      - userId
      - sortBy
    properties:
      userId:
        type: integer
        example: 1
      sortBy:
        type: string
        example: "lastName"

paths:
  /register.php:
    post:
      tags:
        - Users
      summary: Register a new user
      operationId: Register
      description: Creates a new user account in the contacts app
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: registerItem
          description: Register
          schema:
            $ref: '#/definitions/Register'
      responses:
        200:
          description: OK
        404:
          description: URL Not Found

  /login.php:
    post:
      tags:
        - Users
      summary: Log in to contacts app
      operationId: Login
      description: Logs in to the contacts app
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: loginItem
          description: Login
          schema:
            $ref: '#/definitions/Login'
      responses:
        200:
          description: OK
        404:
          description: URL Not Found

  /deleteuser.php:
    post:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      description: Deletes a user and all their contacts
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: deleteUserItem
          description: Delete User
          schema:
            $ref: '#/definitions/DeleteUser'
      responses:
        200:
          description: OK
        404:
          description: URL Not Found

  /addcontact.php:
    post:
      tags:
        - Contacts
      summary: Add a contact
      operationId: addContact
      description: Adds a new contact to the contacts app database
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: addContactItem
          description: Add Contact
          schema:
            $ref: '#/definitions/AddContact'
      responses:
        200:
          description: OK
        404:
          description: URL Not Found

  /updatecontact.php:
    post:
      tags:
        - Contacts
      summary: Update a contact
      operationId: updateContact
      description: Updates an existing contact in the contacts app database
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: updateContactItem
          description: Update Contact
          schema:
            $ref: '#/definitions/UpdateContact'
      responses:
        200:
          description: OK
        404:
          description: URL Not Found

  /deletecontact.php:
    post:
      tags:
        - Contacts
      summary: Delete a contact
      operationId: deleteContact
      description: Deletes a contact from the contacts app database
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: deleteContactItem
          description: Delete Contact
          schema:
            $ref: '#/definitions/DeleteContact'
      responses:
        200:
          description: OK
        404:
          description: URL Not Found

  /searchcontacts.php:
    post:
      tags:
        - Contacts
      summary: Search contacts
      operationId: searchContacts
      description: Searches contacts in the contacts app database
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: searchContactItem
          description: Search Contacts
          schema:
            $ref: '#/definitions/SearchContacts'
      responses:
        200:
          description: OK
        404:
          description: URL Not Found

  /sortcontacts.php:
    post:
      tags:
        - Contacts
      summary: Sort contacts
      operationId: sortContacts
      description: Returns contacts sorted by a specified field
      consumes:
        - application/json
      produces:
        - application/json
      parameters:
        - in: body
          name: sortContactItem
          description: Sort Contacts
          schema:
            $ref: '#/definitions/SortContacts'
      responses:
        200:
          description: OK
        404:
          description: URL Not Found
