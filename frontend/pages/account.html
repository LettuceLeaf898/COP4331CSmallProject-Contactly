<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contactly</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/account.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <header class="top-bar">
      <a href="homepage.html" class="logo-container">
        <img
          src="../assets/images/logo.svg"
          alt="Contactly Logo"
          class="navbar-logo"
        />
      </a>

      <div class="user-profile">
        <button class="dropdown-trigger" id="profileBtn">
          <span class="user-name" id="userName"></span>
          <img
            src="../assets/images/chevron-down.svg"
            alt="Dropdown arrow"
            class="dropdown-arrow"
          />
        </button>

        <div class="dropdown-menu" id="dropdownMenu">
          <a href="homepage.html">
            <img
              src="../assets/images/house-fill.svg"
              alt=""
              class="menu-icon"
            />
            Homepage
          </a>

          <button type="button" class="dropdown-logout" id="logoutButton">
            <img
              src="../assets/images/box-arrow-left.svg"
              alt=""
              class="menu-icon"
            />
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="account-page">
      <section class="account-section">
        <div class="account-header">
          <h1>My Account</h1>
          <p>Manage your personal information and details.</p>
        </div>
        <div class="account-container">
          <div class="account-info-card">
            <div class="account-info-title">
              <h2 id="accountUserName"></h2>
            </div>
            <div class="divider"></div>
            <div class="account-info-content">
              <h6>First Name</h6>
              <p id="displayFirstName"></p>
              <h6>Last Name</h6>
              <p id="displayLastName"></p>
              <h6>Email</h6>
              <p id="displayEmail"></p>
              <h6>Phone Number</h6>
              <p id="displayPhone"></p>
              <h6>Date Created</h6>
              <div class="date-created">
                <img
                  src="../assets/images/clock-fill.svg"
                  alt=""
                  class="calendar-icon"
                />
                <p id="displayDateCreated"></p>
              </div>
            </div>
            <div class="account-edit-delete">
              <div>
                <button
                  class="btn-primary delete-button"
                  data-bs-toggle="modal"
                  data-bs-target="#deleteContactModal"
                >
                  Delete
                </button>
                <div class="modal fade" id="deleteContactModal" tabindex="-1">
                  <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h5 class="modal-title">Delete Account</h5>
                        <button
                          type="button"
                          class="btn-close"
                          data-bs-dismiss="modal"
                        ></button>
                      </div>

                      <div class="modal-body">
                        <p>
                          By deleting your account, all of your data wil be
                          permanently lost. Are you sure you want to delete your
                          account?
                        </p>
                      </div>
                      <div>
                        <p id="deleteMessage" class="message"></p>
                      </div>

                      <div class="modal-footer">
                        <button
                          type="button"
                          class="cancel-button"
                          data-bs-dismiss="modal"
                        >
                          Cancel
                        </button>
                        <button
                          type="button"
                          class="btn-primary delete-button-actual"
                          id="deleteAccountButton"
                        >
                          Yes, Delete Account
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div>
                <button
                  class="btn-primary edit-button"
                  data-bs-toggle="modal"
                  data-bs-target="#editContactModal"
                  id="editAccountButton"
                >
                  Edit
                </button>
                <div class="modal fade" id="editContactModal" tabindex="-1">
                  <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                      <div class="modal-header">
                        <h5 class="modal-title">Edit Account</h5>
                        <button
                          type="button"
                          class="btn-close"
                          data-bs-dismiss="modal"
                        ></button>
                      </div>

                      <div class="modal-body">
                        <form id="updateForm" novalidate>
                          <div class="total-form">
                            <div class="form-group">
                              <label for="email" class="form-label"
                                >Email</label
                              >
                              <div class="input-icon-wrapper">
                                <img
                                  src="../assets/images/envelope-fill.svg"
                                  alt="Email icon"
                                  class="input-icon"
                                />

                                <input
                                  type="email"
                                  class="form-control custom-input"
                                  id="editEmail"
                                  placeholder="Enter your email"
                                  required
                                />
                              </div>
                            </div>
                            <div class="form-group">
                              <label for="phone" class="form-label"
                                >Phone Number</label
                              >
                              <div class="input-icon-wrapper">
                                <img
                                  src="../assets/images/telephone-fill.svg"
                                  alt="Phone icon"
                                  class="input-icon"
                                />

                                <input
                                  type="tel"
                                  class="form-control custom-input"
                                  id="editPhone"
                                  placeholder="Enter your phone number"
                                  required
                                />
                              </div>
                            </div>
                            <div class="form-group">
                              <label for="newPassword" class="form-label"
                                >New Password</label
                              >

                              <div class="password-input-wrapper">
                                <img
                                  src="../assets/images/lock-fill.svg"
                                  alt="Password icon"
                                  class="password-left-icon"
                                />

                                <input
                                  type="password"
                                  class="form-control password-input"
                                  id="newPassword"
                                  placeholder="Enter your new password"
                                  required
                                />

                                <button
                                  type="button"
                                  class="password-toggle"
                                  data-target="newPassword"
                                >
                                  <img
                                    src="../assets/images/eye-fill.svg"
                                    alt="Show password"
                                    class="password-eye-icon"
                                  />
                                </button>
                              </div>
                            </div>
                            <div class="form-group">
                              <label for="confirmPassword" class="form-label"
                                >Confirm Password</label
                              >

                              <div class="password-input-wrapper">
                                <img
                                  src="../assets/images/lock-fill.svg"
                                  alt="Password icon"
                                  class="password-left-icon"
                                />

                                <input
                                  type="password"
                                  class="form-control password-input"
                                  id="confirmPassword"
                                  placeholder="Confirm your password"
                                  required
                                />

                                <button
                                  type="button"
                                  class="password-toggle"
                                  data-target="confirmPassword"
                                >
                                  <img
                                    src="../assets/images/eye-fill.svg"
                                    alt="Show password"
                                    class="password-eye-icon"
                                  />
                                </button>
                              </div>
                            </div>
                          </div>
                          <p id="updateMessage" class="message"></p>
                          <div class="modal-footer">
                            <button
                              type="button"
                              class="cancel-button"
                              data-bs-dismiss="modal"
                            >
                              Cancel
                            </button>
                            <button
                              type="submit"
                              class="btn-primary edit-button-actual"
                            >
                              Save
                            </button>
                          </div>
                        </form>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="../js/account.js"></script>
  </body>
</html>
