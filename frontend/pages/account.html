<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contactly</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/account.css" />
  </head>

  <body>
    <header class="top-bar">
      <a href="/index.html" class="logo-container">
        <img
          src="../assets/images/logo.svg"
          alt="Contactly Logo"
          class="navbar-logo"
        />
      </a>

      <div class="user-profile">
        <button class="dropdown-trigger" id="profileBtn">
          <span class="user-name" id="userName">Jane Doe</span>
          <img
            src="../assets/images/dropDownArrow.png"
            alt="Dropdown arrow"
            class="dropdown-arrow"
          />
        </button>

        <div class="dropdown-menu" id="dropdownMenu">
          <a href="account.html">
            <img
              src="../assets/images/person-fill.svg"
              alt=""
              class="menu-icon"
            />
            Account
          </a>

          <button type="button" class="dropdown-logout" id="logoutButton">
            <img
              src="../assets/images/box-arrow-left.svg"
              alt=""
              class="menu-icon"
            />
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="home-page">

       <section class="contacts-section">
        <div class="home-header">
          <h1>My Account</h1>
          <p>Manage your personal information and details</p>
          </div>
          </div>

        <div class="contacts-scroll-area" id="contactsScrollArea">
          <div id="contactsContainer" class="contacts-container"></div>
        </div>
      </section>

      <div class="center-box">
        <!-- Your content goes here -->
      </div>
    </main>

    <script src="../js/homepage.js"></script>
  </body>
</html>
