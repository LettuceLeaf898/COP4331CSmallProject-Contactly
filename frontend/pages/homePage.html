<!doctype html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contactly</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/homepage.css" />
  </head>

  <body>
    <header class="top-bar">
      <a href="./homepage.html" class="logo-container">
        <img
          src="../assets/images/logo.svg"
          alt="Contactly Logo"
          class="navbar-logo"
        />
      </a>

      <div class="user-profile">
        <button class="dropdown-trigger" id="profileBtn">
          <span class="user-name" id="userName">Jane Doe</span>
          <img
            src="../assets/images/chevron-down.svg"
            alt="Dropdown arrow"
            class="dropdown-arrow"
          />
        </button>

        <div class="dropdown-menu" id="dropdownMenu">
          <a href="account.html">
            <img
              src="../assets/images/person-fill.svg"
              alt=""
              class="menu-icon"
            />
            Account
          </a>

          <button type="button" class="dropdown-logout" id="logoutButton">
            <img
              src="../assets/images/box-arrow-left.svg"
              alt=""
              class="menu-icon"
            />
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="home-page">
      <section class="contacts-section">
        <div class="home-header">
          <h1>My Contacts</h1>
          <p>Manage your saved contacts</p>

          <div class="home-search-add">
            <form id="searchForm">
              <div class="search-container">
                <img
                  src="../assets/images/search.svg"
                  alt="search icon"
                  class="search-icon"
                />

                <input
                  type="text"
                  class="form-control custom-input"
                  id="search"
                  placeholder="Search contacts..."
                />

                <button
                  type="submit"
                  class="searchbar-button"
                  id="searchToggle"
                >
                  <img
                    src="../assets/images/search.svg"
                    alt="search icon"
                    class="searchbar-icon"
                  />
                </button>
              </div>
            </form>

            <div class="add-contact">
              <img
                src="../assets/images/plus-lg.svg"
                alt="add icon"
                class="add-icon"
              />
              <button
  type="button"
  id="addContactBtn"
  data-bs-toggle="modal"
  data-bs-target="#addContactModal"
>
  <p class="add-contact-text">Add Contact</p>
</button>
            </div>
          </div>

          <div class="contacts-count">
            <img
              src="../assets/images/people-fill.svg"
              alt=""
              class="count-icon"
            />
            <span id="contactsCount">See All Contacts</span>
          </div>
        </div>

        <div class="contacts-scroll-area" id="contactsScrollArea">
          <div id="contactsContainer" class="contacts-container"></div>
        </div>
      </section>
      <div class="modal fade" id="addContactModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Add Contact</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
  <form id="addContactForm" novalidate>
    <div class="form-row">
      <div class="form-group">
        <label for="contactFirstName" class="form-label">First Name</label>
        <input type="text" class="form-control custom-input" id="contactFirstName" placeholder="First name" required />
      </div>
      <div class="form-group">
        <label for="contactLastName" class="form-label">Last Name</label>
        <input type="text" class="form-control custom-input" id="contactLastName" placeholder="Last name" required />
      </div>
    </div>

    <div class="form-group">
      <label for="contactEmail" class="form-label">Email</label>
      <div class="input-icon-wrapper">
        <img src="../assets/images/envelope-fill.svg" alt="Email icon" class="input-icon" />
        <input type="email" class="form-control custom-input" id="contactEmail" placeholder="Enter email" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="contactPhone" class="form-label">Phone Number</label>
        <div class="input-icon-wrapper">
          <img src="../assets/images/telephone-fill.svg" alt="Phone icon" class="input-icon" />
          <input type="tel" class="form-control custom-input" id="contactPhone" placeholder="(555) 555-5555" required />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Date Created</label>
        <div class="date-created">
          <img src="../assets/images/clock-fill.svg" alt="" class="calendar-icon" />
          <p id="contactDateCreated">May 20, 2026</p>
        </div>
      </div>
    </div>

    <p id="addContactMessage" class="message"></p>

    <div class="modal-footer">
      <button type="button" class="btn-primary modal-delete-button" data-bs-dismiss="modal">Delete</button>
      <button type="submit" class="btn-primary edit-button-actual">Save</button>
    </div>
  </form>
</div>
        </div>
      </div>
    </div>
    </main>
    
    <script src="../js/homepage.js"></script>
  </body>
</html>
