<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contactly</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../assets/css/homePage.css" />
  </head>

  <body>
    <header class="top-bar">
      <a href="./homepage.html" class="logo-container">
        <img
          src="../assets/images/logo.svg"
          alt="Contactly Logo"
          class="navbar-logo"
        />
      </a>

      <div class="user-profile">
        <button class="dropdown-trigger" id="profileBtn">
          <span class="user-name" id="userName">Jane Doe</span>
          <img
            src="../assets/images/chevron-down.svg"
            alt="Dropdown arrow"
            class="dropdown-arrow"
          />
        </button>

        <div class="dropdown-menu" id="dropdownMenu">
          <a href="account.html">
            <img
              src="../assets/images/person-fill.svg"
              alt=""
              class="menu-icon"
            />
            Account
          </a>

          <button type="button" class="dropdown-logout" id="logoutButton">
            <img
              src="../assets/images/box-arrow-left.svg"
              alt=""
              class="menu-icon"
            />
            Logout
          </button>
        </div>
      </div>
    </header>

    <main class="home-page">
      <section class="contacts-section">
        <div class="home-header">
          <h1>My Contacts</h1>
          <p>Manage your saved contacts</p>

          <div class="home-search-add">
            <form id="searchForm">
              <div class="search-container">
                <img
                  src="../assets/images/search.svg"
                  alt="search icon"
                  class="search-icon"
                />

                <input
                  type="text"
                  class="form-control custom-input"
                  id="search"
                  placeholder="Search contacts..."
                />

                <button
                  type="submit"
                  class="searchbar-button"
                  id="searchToggle"
                >
                  <img
                    src="../assets/images/search.svg"
                    alt="search icon"
                    class="searchbar-icon"
                  />
                </button>
              </div>
            </form>

            <div class="add-contact">
              <img
                src="../assets/images/plus-lg.svg"
                alt="add icon"
                class="add-icon"
              />
              <button type="button">
                <p class="add-contact-text">Add Contact</p>
              </button>
            </div>
          </div>

          <div class="contacts-count">
            <img
              src="../assets/images/people-fill.svg"
              alt=""
              class="count-icon"
            />
            <span id="contactsCount">0 Contacts</span>
          </div>
        </div>

        <div class="contacts-scroll-area" id="contactsScrollArea">
          <div id="contactsContainer" class="contacts-container"></div>
        </div>
      </section>
    </main>

    <script src="../js/homepage.js"></script>
  </body>
</html>
