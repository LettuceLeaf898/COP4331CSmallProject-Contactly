<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-circle bg-circle-left"></div>
<div class="bg-circle bg-circle-right"></div>
<div class="bg-dots bg-dots-right"></div>
<div class="bg-dots bg-dots-left"></div>
    <header class="top-bar">
        <a href="/" class="logo-container">
            <div class="logo-brand">
                <img src="logo.png" alt="My Website Logo" class="logo-img">
            </div>
            <span class="logo-subtitle">Contact Manager</span>
        </a>
        
        <div class="user-profile">
            <button class="dropdown-trigger" id="profileBtn">
                <span class="user-name">Jane Doe</span>
                <img src="dropDownArrow.png" alt="Arrow" class="dropdown-arrow">
            </button>
            
            <div class="dropdown-menu" id="dropdownMenu">
    <a href="/account">
        <img src="user.png" alt="" class="menu-icon">
        Account
    </a>
    <a href="/logout">
        <img src="logout.png" alt="" class="menu-icon">
        Logout
    </a>
</div>
        </div>
    </header>

    <main class="main-content">
        <h1>All Contacts</h1>
        <h2>Manage your contacts in one place</h2>

        <div class="search-action-container">
            <form class="search-container" action="/search" method="GET">
                <input 
                    type="search" 
                    class="search-bar" 
                    placeholder="Search contacts..." 
                    name="q"
                    autocomplete="off"
                >
            </form>
            <button class="add-contact-btn">
                <span class="plus-icon">+</span> Add Contact
            </button>
        </div>
        <div class="contacts-count">
            <img src="users.png" alt="" class="count-icon">
            <span>100 Contacts</span>
        </div>

<h6 class="results-text">Results: # Contacts</h6>
    </main>

    <script>
        const profileBtn = document.getElementById('profileBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        // Toggle menu when clicking the button
        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents immediate closing
            dropdownMenu.classList.toggle('show');
        });

        // Close the menu if the user clicks anywhere else on the screen
        window.addEventListener('click', () => {
            if (dropdownMenu.classList.contains('show')) {
                dropdownMenu.classList.remove('show');
            }
        });
    </script>

</body>
</html>
