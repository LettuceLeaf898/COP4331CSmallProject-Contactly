<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg-circle bg-circle-left"></div>
<div class="bg-circle bg-circle-right"></div>
<div class="bg-dots bg-dots-right"></div>
<div class="bg-dots bg-dots-left"></div>
    <header class="top-bar">
        <a href="/" class="logo-container">
            <div class="logo-brand">
                <img src="logo.png" alt="My Website Logo" class="logo-img">
            </div>
            <span class="logo-subtitle">Contact Manager</span>
        </a>

        <div class="user-profile">
            <button class="dropdown-trigger" id="profileBtn">
                <span class="user-name">Jane Doe</span>
                <img src="dropDownArrow.png" alt="Arrow" class="dropdown-arrow">
            </button>

            <div class="dropdown-menu" id="dropdownMenu">
                <a href="/account">
                    <img src="User.png" alt="" class="menu-icon">
                    Account
                </a>
                <a href="/logout">
                    <img src="Logout.png" alt="" class="menu-icon">
                    Logout
                </a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <h1>All Contacts</h1>
        <h2>Manage your contacts in one place</h2>

        <div class="search-action-container">
            <form class="search-container" action="/search" method="GET">
                <input
                    type="search"
                    class="search-bar"
                    placeholder="Search contacts..."
                    name="q"
                    autocomplete="off"
                >
            </form>
            <button class="add-contact-btn">
                <span class="plus-icon">+</span> Add Contact
            </button>
        </div>

        <div class="contacts-count">
            <img src="users.png" alt="" class="count-icon">
            <span id="countBadge"># Contacts</span>
        </div>

        <h6 class="results-text">Results: # Contacts</h6>

        <!-- THIS was missing: the container the script fills with cards -->
        <div class="contacts-grid" id="contactsGrid"></div>
    </main>

    <script>
        const profileBtn = document.getElementById('profileBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');

        // Toggle menu when clicking the button
        profileBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevents immediate closing
            dropdownMenu.classList.toggle('show');
        });

        // Close the menu if the user clicks anywhere else on the screen
        window.addEventListener('click', () => {
            if (dropdownMenu.classList.contains('show')) {
                dropdownMenu.classList.remove('show');
            }
        });
    </script>

   <script>
async function loadContacts() {
    const grid = document.getElementById('contactsGrid');

    try {
        const res = await fetch('LAMPAPI/GetContacts.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: 5 })   // 5 = John, who has a contact
        });
        const data = await res.json();
        console.log(data);   // check this in the browser console (F12)

        const contacts = data.contacts || [];

        // Update the badge and results line with the real count
        document.getElementById('countBadge').textContent =
            contacts.length + ' Contacts';
        document.querySelector('.results-text').textContent =
            'Results: ' + contacts.length + ' Contacts';

        grid.innerHTML = contacts.map(c => `
            <div class="contact-card">
                <div class="card-header">
                    <h3 class="contact-name">${c.FirstName} ${c.LastName}</h3>
                    <button class="card-menu">⋮</button>
                </div>
                <div class="contact-row">
                    <img src="Email.png" alt="" class="row-icon">
                    <span>${c.Email}</span>
                </div>
                <div class="contact-row">
                    <img src="Phone.png" alt="" class="row-icon">
                    <span>${c.Phone}</span>
                </div>
                <div class="contact-row">
                    <img src="Clock.png" alt="" class="row-icon">
                    <span>${formatDate(c.AddDate)}</span>
                </div>
            </div>
        `).join('');

    } catch (err) {
        console.error(err);
        grid.innerHTML = '<p>Could not load contacts.</p>';
    }
}

// Turn "2026-05-21 16:03:49" into "May 21, 2026"
function formatDate(dbDate) {
    if (!dbDate) return '';
    const d = new Date(dbDate.replace(' ', 'T'));
    return d.toLocaleDateString('en-US', {
        month: 'long', day: 'numeric', year: 'numeric'
    });
}

loadContacts();
</script>
</body>
</html>
